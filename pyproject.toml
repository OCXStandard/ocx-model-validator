[project]
name = "ocx-model-validator"
version = "0.4.0"
description = "Parse and validate OCX .3docx ship model files into a schema-neutral IR"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0,<2",
    "ocx>=3.2.0",
    "xsdata[lxml]>=26.0",
    "lxml>=6.0",
    "loguru>=0.7",
    "packaging>=23.1",
    "typer>=0.9",
    "rich>=13",
]

[project.scripts]
ocx-mcp = "ocx_model_validator.mcp.server:main"
ocx-validate = "ocx_model_validator.cli:entrypoint"
validator = "ocx_model_validator.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ocx_model_validator"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m \"not integration\""
pythonpath = ["."]
markers = ["integration: requires the real OCX reference model"]
